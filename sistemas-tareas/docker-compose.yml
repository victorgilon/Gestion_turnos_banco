version: '3.8'

services:
  frontend:
    image: nginx
    container_name: frontend_app
    ports:
      - "8081:80"
    volumes:
      - ${PWD}/frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017/tareas_db

  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=tareas_db