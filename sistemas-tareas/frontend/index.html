<!DOCTYPE html>
<html>
<head>
  <title>Gestion de Tareas</title>
</head>
<body>

  <h1>Gestion de Tareas</h1>

  <!-- ================= CREAR ================= -->
  <h2>Crear tarea</h2>
  <input id="titulo" placeholder="Título">
  <input id="descripcion" placeholder="Descripción">
  <button onclick="crearTarea()">Crear</button>

  <!-- ================= CONSULTAR ================= -->
  <h2>Consultar tareas</h2>
  <button onclick="cargarTareas()">Mostrar tareas</button>

  <ul id="lista"></ul>

  <!-- ================= SCRIPT ================= -->
  <script>
    //  CORRECCIÓN FINAL
    const API = "http://localhost:4000/tareas";

    // ================= CONSULTAR =================
    async function cargarTareas() {
      try {
        const res = await fetch(API);
        const data = await res.json();

        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        data.forEach(t => {
          const li = document.createElement("li");

          li.innerHTML = `
            <strong>${t.titulo}</strong> - ${t.descripcion}
            
            <button onclick="editarTarea('${t._id}', '${t.titulo}', '${t.descripcion}')">
             Actualizar
            </button>

            <button onclick="eliminarTarea('${t._id}')">
              Eliminar
            </button>
          `;

          lista.appendChild(li);
        });

      } catch (error) {
        alert("Error conectando con el backend");
      }
    }

    // ================= CREAR =================
    async function crearTarea() {
      const titulo = document.getElementById("titulo").value;
      const descripcion = document.getElementById("descripcion").value;

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            titulo,
            descripcion
          })
        });

        if (!res.ok) throw new Error();

        alert("Tarea creada");
        cargarTareas();

      } catch (error) {
        alert("Error al crear tarea");
      }
    }

    // ================= ELIMINAR =================
    async function eliminarTarea(id) {
      try {
        const res = await fetch(API + "/" + id, {
          method: "DELETE"
        });

        if (!res.ok) throw new Error();

        alert("Tarea eliminada");
        cargarTareas();

      } catch (error) {
        alert("Error al eliminar");
      }
    }

    // ================= ACTUALIZAR =================
    function editarTarea(id, tituloActual, descripcionActual) {
      const nuevoTitulo = prompt("Nuevo título:", tituloActual);
      const nuevaDescripcion = prompt("Nueva descripción:", descripcionActual);

      if (nuevoTitulo && nuevaDescripcion) {
        fetch(API + "/" + id, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            titulo: nuevoTitulo,
            descripcion: nuevaDescripcion
          })
        }).then(() => {
          alert("Tarea actualizada");
          cargarTareas();
        });
      }
    }

  </script>

</body>
</html>
