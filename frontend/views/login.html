<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/style.css" />
        <title>Inicio de sesion</title>
    </head>
    <body>
        <div class="contenedor-fondo">
            <div class="contenedor-flotante">
                <div class="mancha-suave mancha-1"></div>
                <div class="mancha-suave mancha-2"></div>
                <div class="mancha-suave mancha-3"></div>
                <div class="mancha-suave mancha-4"></div>
            </div>
        </div>

        <div class="contenedor-login">
            <div class="carta">
                <div class="header">


                    <h1 class="titulo">¡Hola!</h1>
                </div>

                <form class="contenedor-formulario" id="login-formulario">
                    <div class="contenedor-login">
                        <div class="caja-login">
                            <input type="email" id="email" name="email" required autocomplete="email" />
                            <label for="email">Correo electronico</label>
                        </div>

                        <span class="contenedor-error" id="emailError"></span>

                        <div class="caja-login">
                            <input type="password" id="password" name="password" required />
                            <label for="password">Contraseña</label>
                        </div>

                        <span class="contenedor-error" id="passwordError"></span>
                    </div>
                    <a href="#" class="enlace-comodo">¿Olvidaste tu contraseña?</a>

                    <button type="submit" class="boton-login">
                        <div class="boton"></div>
                        <div class="texto-boton">Ingresar</div>

                        <div class="cargar-boton">
                            <div class="spinner-suave">
                                <div class="circulo-spinner"></div>
                            </div>
                        </div>
                        <div class="brillo-boton"></div>
                    </button>
                </form>

                <div class="contenedor-registro">
                    <span class="texto-registro">¿No tienes una cuenta?</span>
                    <a href="#" class="registro-enlace">Registrase</a>
                </div>
            </div>
        </div>
    </body>
</html>
