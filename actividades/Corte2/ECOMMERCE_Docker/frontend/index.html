<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tienda básica</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="header">
            <h1>Tienda básica</h1>
            <p>Gestión de productos conectados a MySQL</p>
        </header>

        <main class="contenedor">
            <!-- FORMULARIO -->
            <section class="card">
                <h2>Agregar producto</h2>

                <form id="productoForm" class="formulario">
                    <div class="campo">
                        <label>Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej: Arroz" required />
                    </div>

                    <div class="campo">
                        <label>Precio</label>
                        <input type="number" id="precio" placeholder="Ej: 2500" min="1" step="0.01" required />
                    </div>

                    <button type="submit">Guardar producto</button>
                </form>

                <p id="mensaje" class="mensaje"></p>
            </section>

            <!-- LISTA -->
            <section class="card">
                <div class="encabezado-lista">
                    <h2>Productos</h2>
                    <button id="recargarBtn" class="secundario">Recargar</button>
                </div>

                <div id="listaProductos" class="lista"></div>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 - Sistema de productos</p>
        </footer>

        <script src="app.js"></script>
    </body>
</html>
