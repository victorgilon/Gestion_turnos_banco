<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante Docker</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #e67e22; }
        .status { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SISTEMA DE RESTAURANTE</h1>

        <p>Los microservicios (Pedidos, Usuarios, Catálogo) están corriendo en el fondo dentro de sus propios contenedores.</p>
    </div>

</html>
